name: cloud-notes-lab06

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Salin .env.example ke .env}
      POSTGRES_USER: ${POSTGRES_USER:?Salin .env.example ke .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      APP_ENV: ${APP_ENV:-classroom}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:?Salin .env.example ke .env}
      DB_USER: ${POSTGRES_USER:?Salin .env.example ke .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
      REDIS_URL: redis://cache:6379/0
    ports:
      - "127.0.0.1:18006:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:4
    profiles: [debug]
    ports:
      - "127.0.0.1:18061:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
